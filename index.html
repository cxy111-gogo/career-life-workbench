<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#d946ef" />
  <meta name="color-scheme" content="light" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="成长工作台" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <title>求职生活成长工作台</title>
  <style>
    :root {
  --color-primary: #18181b;
  --color-accent: #d946ef;
  --color-accent-soft: #fdf2f8;
  --color-accent-line: #f5d0fe;
  --color-success: #16a34a;
  --color-danger: #dc2626;
  --color-warning: #d97706;
  --color-bg-page: #fff7fb;
  --color-bg-card: #ffffff;
  --color-bg-subtle: #fafafa;
  --color-text-primary: #09090b;
  --color-text-body: #3f3f46;
  --color-text-secondary: #71717a;
  --color-text-muted: #8b5f7f;
  --color-border: #eadde8;
  --color-divider: #f4e8f2;
  --shadow-sm: 0 1px 2px rgba(82, 23, 74, 0.05);
  --shadow-md: 0 8px 24px rgba(82, 23, 74, 0.08);
  --radius: 8px;
  --tap: 44px;
  --text-display: 28px;
  --text-h1: 22px;
  --text-h2: 16px;
  --text-body: 14px;
  --text-small: 12px;
}

* { box-sizing: border-box; }
html { min-height: 100%; background: var(--color-bg-page); }
body {
  min-height: 100%; margin: 0;
  font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  font-size: var(--text-body); color: var(--color-text-body);
  background: var(--color-bg-page); -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; }
button { min-height: var(--tap); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
  outline: 2px solid var(--color-accent); outline-offset: 2px; border-radius: 6px;
}
button:active { transform: scale(0.98); }

.app-shell { display: flex; min-height: 100vh; overflow: hidden; }
.sidebar {
  width: 244px; flex-shrink: 0; min-height: 100vh; padding: 16px 12px;
  background: rgba(255,255,255,0.88); border-right: 1px solid var(--color-border);
  display: flex; flex-direction: column; gap: 14px; backdrop-filter: blur(12px);
}
.brand-block { display: flex; align-items: center; gap: 12px; padding: 8px 8px 16px; border-bottom: 1px solid var(--color-divider); }
.brand-mark { width: 38px; height: 38px; display:grid; place-items:center; border-radius: 10px; background: var(--color-primary); color:#fff; font-weight:700; }
.brand-title { font-size: 15px; font-weight: 700; color: var(--color-text-primary); }
.brand-subtitle { margin-top: 2px; font-size: 12px; color: var(--color-text-secondary); }
.nav-list { display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }
.nav-item {
  width: 100%; min-height: 44px; border: 0; background: transparent; color: var(--color-text-body);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 9px 10px; border-radius: 8px; cursor: pointer; text-align: left;
  transition: background 120ms, color 120ms;
}
.nav-item:hover { background: #f7edf5; color: var(--color-text-primary); }
.nav-item.active { background: var(--color-accent-soft); color: #a21caf; font-weight: 600; }
.nav-count { font-size: 11px; color: var(--color-text-secondary); font-variant-numeric: tabular-nums; }
.sidebar-footer { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--color-divider); }

.main-panel { flex: 1; min-width: 0; max-height: 100vh; overflow-y: auto; }
.topbar {
  position: sticky; top: 0; z-index: 20; min-height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 16px;
  padding: 16px 24px; background: rgba(255,247,251,0.92); border-bottom: 1px solid var(--color-border); backdrop-filter: blur(14px);
}
.eyebrow { margin: 0 0 4px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); }
h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 0; font-size: var(--text-h1); line-height: 1.2; color: var(--color-text-primary); }
h2 { font-size: 18px; color: var(--color-text-primary); margin-bottom: 6px; }
h3 { font-size: var(--text-h2); color: var(--color-text-primary); margin-bottom: 8px; }
.topbar-actions { display: flex; gap: 8px; align-items: center; }

.primary-btn, .secondary-btn, .ghost-btn, .icon-button {
  border-radius: 8px; border: 1px solid var(--color-border); cursor: pointer; transition: background 120ms, color 120ms, border-color 120ms, transform 80ms;
}
.primary-btn { background: var(--color-primary); color: #fff; border-color: var(--color-primary); padding: 8px 15px; font-weight: 600; }
.primary-btn:hover { background: #2d2d30; }
.secondary-btn { background: #fff; color: var(--color-text-primary); padding: 8px 13px; }
.secondary-btn:hover, .ghost-btn:hover, .icon-button:hover { background: #f7edf5; border-color: #e9b9df; }
.ghost-btn { background: transparent; color: var(--color-text-body); padding: 8px 12px; }
.full { width: 100%; display: inline-flex; align-items: center; justify-content: center; text-align:center; }
.file-label { min-height: 44px; }
.icon-button { background: #fff; color: var(--color-text-body); padding: 8px 12px; }
#menuBtn { display: none; }

.status-strip { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; padding: 18px 24px 0; }
.kpi-card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); }
.kpi-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 8px; }
.kpi-value { font-size: 28px; line-height: 1; font-weight: 750; color: var(--color-text-primary); font-variant-numeric: tabular-nums; }
.kpi-note { margin-top: 8px; font-size: 12px; color: var(--color-text-secondary); }

.content-view { padding: 18px 24px 32px; }
.panel-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(280px, .7fr); gap: 16px; align-items: start; }
.card { background: var(--color-bg-card); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); }
.card + .card { margin-top: 14px; }
.card-header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom: 14px; }
.card-copy { margin-bottom: 0; color: var(--color-text-secondary); line-height: 1.7; }
.actions-row { display:flex; flex-wrap: wrap; gap:8px; align-items:center; }

.segmented { display:flex; flex-wrap: wrap; gap:6px; margin-bottom: 14px; }
.segmented button { min-height: 36px; padding: 6px 10px; border:1px solid var(--color-border); background:#fff; border-radius: 7px; cursor:pointer; color: var(--color-text-body); }
.segmented button.active { background: var(--color-primary); border-color: var(--color-primary); color:#fff; }

.record-list { display: grid; gap: 10px; }
.record-item { border: 1px solid var(--color-divider); border-radius: 8px; padding: 12px; background: #fff; display:grid; gap:8px; }
.record-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.record-title { font-weight:700; color: var(--color-text-primary); line-height: 1.45; }
.record-meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.badge { display:inline-flex; align-items:center; gap:4px; padding: 3px 8px; border-radius: 6px; font-size: 12px; background:#f4f4f5; color:#3f3f46; }
.badge.pink { background: var(--color-accent-soft); color:#a21caf; }
.badge.green { background:#f0fdf4; color:#166534; }
.badge.red { background:#fef2f2; color:#991b1b; }
.badge.yellow { background:#fffbeb; color:#92400e; }
.record-notes { color: var(--color-text-secondary); line-height:1.7; white-space: pre-wrap; }
.record-actions { display:flex; justify-content:flex-end; gap:8px; }

.table-wrapper { overflow-x:auto; -webkit-overflow-scrolling: touch; border:1px solid var(--color-divider); border-radius:8px; }
.data-table { width:100%; min-width: 720px; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.data-table caption { text-align:left; padding: 12px 14px; font-weight:700; color: var(--color-text-primary); }
.data-table th { font-size:11px; font-weight:700; color:#71717a; text-transform:uppercase; letter-spacing:.06em; padding:0 14px 10px; text-align:left; border-bottom:1px solid var(--color-divider); white-space:nowrap; }
.data-table td { height:44px; padding:0 14px; border-bottom:1px solid #faf0f7; color:var(--color-text-body); }
.data-table tr:hover td { background:#fffafd; }
.data-table th.num, .data-table td.num { text-align:right; }

.timeline { display:grid; gap:10px; }
.timeline-item { display:grid; grid-template-columns: 80px 1fr; gap:10px; align-items:start; }
.timeline-date { font-size:12px; color:var(--color-text-secondary); font-variant-numeric: tabular-nums; }
.timeline-body { border-left:2px solid var(--color-accent-line); padding-left:12px; min-height:34px; }

.habit-grid { display:grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:10px; }
.habit { padding:14px; border:1px solid var(--color-divider); border-radius:8px; background:#fff; }
.habit-title { font-weight:700; color:var(--color-text-primary); }
.habit-track { margin-top:10px; display:grid; grid-template-columns: repeat(7,1fr); gap:4px; }
.dot { height:22px; border-radius:5px; background:#f4f4f5; border:1px solid #eee; }
.dot.done { background:var(--color-accent-soft); border-color:var(--color-accent-line); }

.modal { border:1px solid var(--color-border); border-radius: 12px; width:min(620px, calc(100vw - 28px)); padding:0; box-shadow: var(--shadow-md); }
.modal::backdrop { background: rgba(24,24,27,.32); }
.modal form { padding:18px; }
.modal-header, .modal-actions { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.form-grid { display:grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap:12px; margin:16px 0; }
.field { display:grid; gap:6px; }
.field.full-span { grid-column: 1 / -1; }
.field label { font-size:12px; font-weight:700; color:var(--color-text-secondary); text-transform:uppercase; letter-spacing:.05em; }
.field input, .field select, .field textarea { width:100%; border:1px solid var(--color-border); border-radius:8px; padding:9px 10px; background:#fff; color:var(--color-text-primary); }
.field textarea { min-height: 88px; resize: vertical; line-height:1.6; }
.field .hint { font-size:12px; color:var(--color-text-secondary); }
.empty-state { border:1px dashed var(--color-border); border-radius:10px; padding:28px; text-align:center; background:#fffafd; }
.empty-title { font-weight:750; font-size:18px; color:var(--color-text-primary); margin-bottom:8px; }
.empty-copy { color:var(--color-text-secondary); line-height:1.7; max-width:420px; margin:0 auto 16px; }
.visually-hidden { position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
.drawer-backdrop { position:fixed; inset:0; background:rgba(24,24,27,.24); z-index:39; }

@media (min-width: 768px) { :root { --text-display: 36px; --text-h1: 24px; } }
@media (max-width: 1023px) {
  .app-shell { display:block; }
  .sidebar { position: fixed; z-index: 40; inset:0 auto 0 0; transform: translateX(-105%); transition: transform 180ms ease; box-shadow: var(--shadow-md); }
  .sidebar.open { transform: translateX(0); }
  #menuBtn { display:inline-flex; }
  .main-panel { max-height:none; min-height:100vh; }
  .topbar { padding: 12px 14px; min-height:70px; }
  .topbar-actions .secondary-btn { display:none; }
  .status-strip { grid-template-columns: repeat(2,minmax(0,1fr)); padding:14px 14px 0; }
  .content-view { padding:14px; }
  .panel-grid { grid-template-columns:1fr; }
}
@media (max-width: 560px) {
  .topbar { align-items:flex-start; }
  .topbar-actions { flex-direction:column; align-items:stretch; }
  .primary-btn, .secondary-btn, .ghost-btn, .icon-button { min-height:44px; }
  .status-strip { grid-template-columns:1fr; }
  .form-grid { grid-template-columns:1fr; }
  input, select, textarea { font-size:16px !important; }
  .habit-grid { grid-template-columns:1fr; }
  .timeline-item { grid-template-columns: 68px 1fr; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}

  </style>
</head>
<body>
  <div class="app-shell" id="app">

    <main class="main-panel" role="main">

        <button class="icon-button" id="menuBtn" type="button" aria-label="打开导航" aria-expanded="false" aria-controls="sidebar">目录</button>

  <div class="drawer-backdrop" id="backdrop" hidden></div>

      </menu>

  <script>
    const STORAGE_KEY = 'careerLifeWorkbench.v2';
const LEGACY_STORAGE_KEY = 'careerLifeWorkbench.v1';
const today = new Date().toISOString().slice(0, 10);
const seedData = {

function loadState() {

}
function saveState() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); render(); }
function byDate(a, b) { return String(a.deadline || a.date || '').localeCompare(String(b.deadline || b.date || '')); }
function statusClass(value) {
  if (['已完成', '高', '适配', '进行中'].includes(value)) return 'green';
  if (['风险', '低', '错过'].includes(value)) return 'red';
  if (['待观察', '中', '待设置', '计划中'].includes(value)) return 'yellow';

}

function renderTimeline(items) { return `<div class="timeline">${items.map(x => `<div class="timeline-item"><div class="timeline-date">${x.deadline || x.date}</div><div class="timeline-body"><div class="record-title">${x.title}</div><div class="record-notes">${x.notes}</div></div></div>`).join('')}</div>`; }
function renderRecord(x) { return `<article class="record-item"><div class="record-top"><div><div class="record-title">${x.title}</div><div class="record-meta"><span class="badge pink">${x.category || x.type}</span><span class="badge ${statusClass(x.status || x.priority)}">${x.status || x.priority || '记录中'}</span></div></div><button class="ghost-btn" type="button" data-delete="${x.type}:${x.id}">删除</button></div><div class="record-notes">${x.notes || ''}</div></article>`; }
function renderHabit(x) { const done = Math.max(1, Math.min(7, Number(x.score || 1) + 2)); return `<article class="habit"><div class="habit-title">${x.title}</div><div class="record-meta"><span class="badge pink">${x.category}</span><span class="badge ${statusClass(x.status)}">${x.status}</span></div><div class="habit-track" aria-label="状态热度 ${x.score} 分">${Array.from({length:7}, (_,i)=>`<span class="dot ${i < done ? 'done' : ''}"></span>`).join('')}</div><p class="card-copy" style="margin-top:10px">${x.notes}</p></article>`; }

function openDialog() {
  const type = active === 'jobs' || active === 'profile' || active === 'resume' ? 'jobs' : active === 'life' ? 'life' : active === 'growth' ? 'growth' : 'jobs';
  const fields = type === 'jobs' ? jobFields() : type === 'life' ? lifeFields() : growthFields();
  document.getElementById('formFields').innerHTML = fields;
  document.getElementById('entryForm').dataset.type = type;
  document.getElementById('entryDialog').showModal();
}
function jobFields() { return field('title','事项名称','text','如：某省选调公告') + field('org','组织/渠道','text','如：广东省人社厅') + field('category','分类','text','企业岗位 / 公考 / 事业编') + field('stage','阶段','text','资料池 / 报名中 / 已投递') + field('deadline','截止节点','date','') + field('fit','适配度','number','0-100') + field('priority','优先级','text','高 / 中 / 低') + area('notes','资料与经验总结','岗位要求、材料清单、经验链接、下一步'); }
function lifeFields() { return field('title','记录名称','text','如：力量训练') + field('date','日期','date','') + field('category','分类','text','健身 / 睡眠 / 情绪 / 生理期') + field('status','状态','text','已完成 / 待观察') + field('score','状态评分','number','1-5') + area('notes','备注','身体感受、诱因、要提醒自己的事'); }
function growthFields() { return field('title','复盘主题','text','如：关系匮乏感复盘') + field('date','日期','date','') + field('category','分类','text','财商 / 情商 / 情绪课题') + field('cadence','频率','text','每周 / 每月') + field('status','状态','text','进行中 / 计划中') + area('notes','复盘内容','事实、感受、需求、下一步行动'); }
function field(name, label, type, placeholder) { return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" placeholder="${placeholder}" ${type === 'date' ? `value="${today}"` : ''}></div>`; }
function area(name, label, placeholder) { return `<div class="field full-span"><label for="${name}">${label}</label><textarea id="${name}" name="${name}" placeholder="${placeholder}"></textarea><div class="hint">写短一点也可以，关键是能追踪。</div></div>`; }
function saveEntry(event) {
  if (event.submitter?.value === 'cancel') return;
  event.preventDefault();
  const form = event.currentTarget;
  const type = form.dataset.type;
  const data = Object.fromEntries(new FormData(form).entries());
  if (!data.title?.trim()) { alert('请填写记录名称'); return; }
  data.id = crypto.randomUUID(); data.type = type;
  if (type === 'jobs') { data.fit = Number(data.fit || 0); }
  if (type === 'life') { data.score = Number(data.score || 3); }
  state[type].push(data); document.getElementById('entryDialog').close(); form.reset(); saveState();
}
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `career-life-workbench-${today}.json`; a.click(); URL.revokeObjectURL(url);
}
function importData(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { try { state = { ...structuredClone(seedData), ...JSON.parse(reader.result) }; saveState(); alert('备份已导入'); } catch { alert('备份文件无法识别，请选择 JSON 文件'); } };
  reader.readAsText(file);
}
function requestNotify() {
  if (!('Notification' in window)) { alert('当前浏览器不支持通知。可以先用系统日历设置提醒。'); return; }
  Notification.requestPermission().then(result => {
    if (result === 'granted') new Notification('提醒已开启', { body: '这个版本支持本机通知授权，具体定时提醒需要接入系统或云端任务。' });
  });
}

document.addEventListener('click', (e) => {
  const navBtn = e.target.closest('[data-nav]');
  if (navBtn) { active = navBtn.dataset.nav; activeFilter = '全部'; closeSidebar(); render(); }
  const filterBtn = e.target.closest('[data-filter]');
  if (filterBtn) { activeFilter = filterBtn.dataset.filter; render(); }
  const quick = e.target.closest('[data-action="quick-add"], #quickAddBtn');
  if (quick) openDialog();
  const del = e.target.closest('[data-delete]');
  if (del) { const [type, id] = del.dataset.delete.split(':'); state[type] = state[type].filter(x => x.id !== id); saveState(); }
});
document.getElementById('entryForm').addEventListener('submit', saveEntry);
document.getElementById('exportBtn').addEventListener('click', exportData);
document.getElementById('importFile').addEventListener('change', e => importData(e.target.files[0]));
document.getElementById('notifyBtn').addEventListener('click', requestNotify);
document.getElementById('menuBtn').addEventListener('click', () => { document.getElementById('sidebar').classList.add('open'); document.getElementById('backdrop').hidden = false; document.getElementById('menuBtn').setAttribute('aria-expanded', 'true'); });
document.getElementById('backdrop').addEventListener('click', closeSidebar);
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('backdrop').hidden = true; document.getElementById('menuBtn').setAttribute('aria-expanded', 'false'); }
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
render();

  </script>
