name: Update Live Feed

on:
  schedule:
    # Beijing time 08:30 and 20:30 every day = UTC 00:30 and 12:30
    - cron: '30 0,12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-live-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update data/live_feed.json
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          MAX_RESULTS_PER_QUERY: 4
        run: node scripts/update-live-feed.mjs

      - name: Commit updated feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update personalized live feed"
          file_pattern: data/live_feed.json
